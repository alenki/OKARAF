[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7.3 needs Node 22.12+.
  NODE_VERSION = "22"

# The old site's certificates page now lives in the archive.
[[redirects]]
  from = "/certificates"
  to = "/archive/"
  status = 301

[[redirects]]
  from = "/certificates/index.html"
  to = "/archive/"
  status = 301

# Fingerprinted build output and fonts never change under the same URL.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
