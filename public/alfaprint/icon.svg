<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    TAB ICON. The same mark as in the header, with the same paths: the letter on
    plate K, the tick on plate R. The paths are copied from
    src/components/chrome/Mark.tsx (MARK_K and MARK_R) and must match it exactly:
    this file is static and cannot import anything, so the copy is edited by
    hand together with it.

    Square, not 120x100 as before: tabs, bookmarks and desktop tiles show the
    icon in a square field, and each of them pads a non-square file its own way.

    THE FIELD IS EMPTY, THERE IS NO TILE. The mark is cut to its ink and sits
    directly on whatever the browser puts under it: the tab strip, bookmarks,
    the list of frequent sites. The tile's rounded corners went with the tile;
    the ink has its own outline. A desktop tile supplies its own field.

    THE LETTER CHANGES INK WITH THE WINDOW THEME. Without a tile one ink is not
    enough: ash would vanish on a light tab strip, ink on a dark one. So the
    letter prints in ink by default and in ash under prefers-color-scheme: dark,
    the same move currentColor makes for it in the header. A browser that does
    not read the query gets the light case, which is the default tab strip. The
    tick needs no adjustment: rubine shows on both fields, as on paper.

    SHIFTED RIGHT BY 3.91 INSTEAD OF EQUAL MARGINS. The mark's box (MARK_VIEWBOX,
    0 0 120 90.47) hugs the ink, but the ink inside it is uneven: a heavy letter
    on the left, and on the right only the thin, nearly weightless tip of the
    tick holds the box. Centred by its box, the mark looked shifted left. Here
    it is set by the CENTRE OF MASS of the ink: coverage measured on a
    1024x1024 grid puts it at x=60.09 against a field centre of 64, so the left
    margin is 13.91 and the right 6.1. By the box the mark is now asymmetric; to
    the eye it sits straight.

    The colours are written as numbers on purpose: this file lives outside CSS
    and cannot see the tokens. #121110 is ink, #EDEBE6 is chalk, #D12A26 is
    rubine, the same three inks as in @theme. (Token names appear here without
    their leading dashes: two dashes in a row inside a comment make the XML
    invalid, and the file stops being an image.)
  -->
  <style>
    .letter { fill: #121110 }
    @media (prefers-color-scheme: dark) { .letter { fill: #EDEBE6 } }
  </style>
  <g transform="translate(13.91 23.3) scale(0.9)">
    <path class="letter" fill-rule="evenodd" d="M44.43 0 L65.35 0 L109.78 85.08 L0 85.08 Z M54.89 39.11 L75.26 85.08 L34.52 85.08 Z"/>
    <path fill="#D12A26" d="M118.8 18.32C120.54 19.42,120.23 22.29,118.7 23.48C117.77 24.2,116.66 24.59,115.72 25.26C111.02 28.59,105.97 31.75,101.6 35.51C97.11 39.38,92.41 43.16,88.19 47.33C80.12 55.28,72.83 63.83,66.12 72.95C63.19 76.94,60.61 81.21,58.08 85.46C57.2 86.93,56.44 89.64,54.67 90.17C53.61 90.02,53.19 89.14,52.35 88.55C49.92 86.84,47.88 84.63,45.47 82.88C36.72 76.49,28.21 69.61,19.08 63.71C16.19 61.84,13.43 60.06,10.11 59.06C8.6 58.6,6.12 59.18,4.96 58.25C4.53 56.98,5.61 55.58,6.38 54.62C8.35 52.17,9.66 49.28,11.63 46.85C13.21 44.89,14.11 41.52,16.62 40.42C19.98 38.96,23.86 40.79,26.88 42.25C34.44 45.92,41.15 50.95,48.01 55.76C49.85 57.06,51.49 58.79,53.18 60.29C54.1 61.12,54.97 62.07,56.29 62.04C57.12 61.67,57.42 60.97,58.01 60.3C59.01 59.18,60.08 58.04,61.14 56.97C64.3 53.78,67.85 50.95,71.29 48.07C76.02 44.1,81.33 40.71,86.42 37.25C87.15 36.76,87.69 36.03,88.43 35.53C93.06 32.42,98.01 29.56,102.84 26.78C106.52 24.67,110.28 22.63,113.93 20.48C115.3 19.67,117.15 18.01,118.8 18.32Z"/>
