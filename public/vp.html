<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>viewport probe</title>
    <!-- Temporary: measures what the browser reports for the screen's height. Delete after use. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d0d0c;
        color: #eee;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
      }
      body {
        min-height: 300vh;
      }
      .probe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        visibility: hidden;
      }
      #vh { height: 100vh; }
      #svh { height: 100svh; }
      #lvh { height: 100lvh; }
      #dvh { height: 100dvh; }
      #safe {
        height: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #fixed-bottom {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 1px;
        height: 1px;
        visibility: hidden;
      }
      #out {
        position: absolute;
        top: 90px;
        left: 10px;
        right: 46px;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .tick {
        position: absolute;
        right: 0;
        height: 0;
        border-top: 1px solid #888;
      }
      .tick span {
        position: absolute;
        right: 14px;
        top: -7px;
        font-size: 10px;
        color: #aaa;
      }
      .line {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        border-top: 2px solid;
      }
      .line span {
        position: absolute;
        bottom: 2px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="probe" id="vh"></div>
    <div class="probe" id="svh"></div>
    <div class="probe" id="lvh"></div>
    <div class="probe" id="dvh"></div>
    <div class="probe" id="safe"></div>
    <div id="fixed-bottom"></div>
    <pre id="out">measuring…</pre>

    <script>
      const $ = (id) => document.getElementById(id)
      const r = (n) => Math.round(n * 10) / 10

      function measure() {
        const vv = window.visualViewport
        const safe = getComputedStyle($('safe'))
        return {
          scrollY: r(window.scrollY),
          vh: r($('vh').getBoundingClientRect().height),
          svh: r($('svh').getBoundingClientRect().height),
          lvh: r($('lvh').getBoundingClientRect().height),
          dvh: r($('dvh').getBoundingClientRect().height),
          inner: window.innerHeight,
          client: document.documentElement.clientHeight,
          vv: vv ? r(vv.height) : null,
          vvTop: vv ? r(vv.offsetTop) : null,
          scale: vv ? r(vv.scale) : null,
          fixedBottom: r($('fixed-bottom').getBoundingClientRect().bottom),
          safeTop: parseFloat(safe.paddingTop),
          safeBottom: parseFloat(safe.paddingBottom),
          screen: screen.height,
          avail: screen.availHeight,
          outer: window.outerHeight,
        }
      }

      const show = (m) =>
        `svh ${m.svh}  lvh ${m.lvh}  dvh ${m.dvh}  vh ${m.vh}\n` +
        `innerHeight ${m.inner}  clientHeight ${m.client}\n` +
        `visualViewport ${m.vv} (top ${m.vvTop}, scale ${m.scale})\n` +
        `fixed bottom:0 at ${m.fixedBottom}\n` +
        `safe-area top ${m.safeTop} bottom ${m.safeBottom}\n` +
        `screen ${m.screen} avail ${m.avail} outer ${m.outer}  scrollY ${m.scrollY}`

      // A ruler down the right edge, in CSS pixels from the top of the page.
      for (let y = 0; y <= 1100; y += 10) {
        const t = document.createElement('div')
        t.className = 'tick'
        t.style.top = `${y}px`
        t.style.width = y % 50 === 0 ? '12px' : '5px'
        if (y % 50 === 0) t.innerHTML = `<span>${y}</span>`
        document.body.append(t)
      }

      // One line where each reported height ends, measured from the top of the page.
      function lines(m) {
        const marks = [
          ['svh', m.svh, '#ff4d4d'],
          ['lvh', m.lvh, '#ffa64d'],
          ['dvh', m.dvh, '#ffe14d'],
          ['inner', m.inner, '#4dff88'],
          ['fixed', m.fixedBottom, '#4dd2ff'],
          ['vv', m.vv + m.vvTop, '#d24dff'],
        ]
        marks.forEach(([name, y, colour], i) => {
          const l = document.createElement('div')
          l.className = 'line'
          l.style.top = `${y}px`
          l.style.borderColor = colour
          l.style.color = colour
          l.innerHTML = `<span style="left:${6 + i * 52}px">${name}</span>`
          document.body.append(l)
        })
      }

      const first = measure()
      lines(first)
      $('out').textContent = `${navigator.userAgent}\n\nON LOAD\n${show(first)}`

      setTimeout(() => {
        $('out').textContent += `\n\nAFTER 1.5s\n${show(measure())}`
      }, 1500)
    </script>
  </body>
</html>
