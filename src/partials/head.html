<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<meta name="author" content="Omar Karaf" />
<meta name="robots" content="{{robots}}" />
<meta name="theme-color" content="#0c0c0b" />
<meta name="color-scheme" content="dark" />
<link rel="canonical" href="{{site}}{{path}}" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="OKARAF" />
<meta property="og:locale" content="en_US" />
<meta property="og:url" content="{{site}}{{path}}" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{site}}/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="The name Omar Karaf in a high-contrast serif over a black-and-white dithered field" />
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{site}}/og.png" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<link rel="preload" href="/src/fonts/Fenice-Regular.woff2" as="font" type="font/woff2" crossorigin />

<!-- Runs before first paint: marks the document as scripted (so the intro veil only exists when
     something can remove it) and remembers whether this visitor has already seen the intro. -->
<script>
  (function (d) {
    var c = 'js';
    try { if (sessionStorage.getItem('okaraf:seen')) c += ' is-return'; } catch (e) {}
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) c += ' is-calm';
    d.className = c;
    // If the module never arrives (offline, blocked), don't leave the page behind the veil.
    window.__veilFallback = setTimeout(function () { d.classList.add('is-stuck'); }, 6000);
  })(document.documentElement);
</script>
<link rel="stylesheet" href="/src/styles/main.css" />
