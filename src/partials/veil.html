<!-- The veil: a sheet of ink that covers the page on arrival and leaves through an ordered dither.
     It doubles as the transition between pages. Only shown when scripts run (html.js). -->
<div class="veil" data-veil aria-hidden="true">
  <canvas class="veil__bits" data-veil-bits></canvas>
  <div class="veil__ui" data-veil-ui>
    <span class="veil__brand">OKARAF</span>
    <span class="veil__note">{{note}}</span>
    <span class="veil__count"><span data-veil-count>000</span></span>
  </div>
</div>
